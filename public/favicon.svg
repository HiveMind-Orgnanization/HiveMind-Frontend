<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#glow)" opacity="0.55" filter="url(#blur)"/>
  <rect x="3" y="3" width="26" height="26" rx="5" fill="#04060c" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="11" y="11" width="10" height="10" transform="rotate(45 16 16)" fill="url(#diamond)"/>
</svg>
